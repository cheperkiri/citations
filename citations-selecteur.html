<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
     body{font-family: sans-serif;}
     div{font-size: 20px;}
     .quote{font-size: 4rem;}
     .source{font-style: italic;}
     .important{background-color: magenta;}
     .citations{
        margin : 2rem;
        padding: 2rem;
        border: 1px solid lightblue;
        border-radius: 1rem;
        aspect-ratio: 16/9;
     }
     #machin{
        background-color: pink;
     }
    </style>
</head>
<body>
  

    
    <div class="citations">
        <div class="quote">"Hello World"</div>
        <div class="source important">- Kiri Cheper</div>
    </div>

    <div class="citation" id="machin">
        <div class="quote">Hello.</div>
        <div class="source">- Kiri Cheper</div>
    </div>
</body>
</html>
