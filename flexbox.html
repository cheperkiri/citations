<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        body {
            font-family: sans-serif;
        }

        section {
            outline: 2px dotted blue;
        }

        div {
            outline: 2px solid red;
        }

        section,
        div {
            margin: 2rem;
            padding: 2rem;
        }

        section {
            display: flex;
            gap: 2rem;
        }

        div {
            flex: 1;
        }

        /* section {display: flex} */
    </style>

<body>
    <section>
        <div>hello Lorem ipsum dolor sit, amet consectetur adipisicing elit. Pariatur, ipsa doloribus aspernatur illo
            sunt odio, aliquam accusantium, minima voluptas commodi perferendis nostrum magnam nam. Maxime voluptatem
            sed ipsa vel neque.</div>
        <div>world</div>
    </section>
</body>

</html>
