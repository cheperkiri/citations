<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        body {
            font-family: sans-serif;
        }

        section {
            outline: 2 px dotted blue;
        }

        div {
            outline: 2 px solid red;
        }

        section,
        div {
            margin: 2 rem;
            padding: 2 rem;
        }

        section {
            display: flex;
        }

        /* section {display: flex} */
        <body><section><div>hello</div><div>world</div></section></body></html>
